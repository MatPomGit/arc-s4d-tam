name: Python source smoke (homeserver)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "configs/**"
      - "pyproject.toml"
      - ".github/workflows/source-local.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s4d-source-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: [self-hosted, Linux, ARM64, homeserver]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Lightweight Python syntax, configuration and metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q src tests tools
          python3 - <<'PY'
          from pathlib import Path
          assert Path('pyproject.toml').is_file()
          assert Path('configs').is_dir()
          print('S4D source smoke passed')
          PY
