quality_rules:
  - "Synthetic fixtures validate plumbing only and never substitute for real benchmark evidence."
  - "Every reportable benchmark result resolves to immutable dataset, model/baseline, config, environment and output provenance."
  - "Final holdout inputs do not drive tuning."
  - "Failures, timeouts and null/negative outcomes remain part of the evidence record."
  - "Publication tables and figures are generated from registered evidence artifacts."
