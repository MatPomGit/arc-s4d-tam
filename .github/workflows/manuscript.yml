name: Manuscript

on:
  # Heavy build reserved for approved local Andromeda execution or
  # manually authorized one-off when provider budget is available.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s4d-manuscript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latex:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            lmodern \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-science

      - name: Build manuscript
        working-directory: manuscript
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Check unresolved references
        working-directory: manuscript
        run: |
          if grep -E "(LaTeX Warning:.*undefined|Citation .* undefined|There were undefined references)" main.log; then
            echo "Unresolved LaTeX references or citations detected."
            exit 1
          fi

      - name: Upload manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: s4d-tam-manuscript
          path: manuscript/main.pdf
          if-no-files-found: error
