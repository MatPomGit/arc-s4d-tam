name: Research governance

on:
  push:
    branches: [main]
    paths:
      - "PROJECT_STATE.yaml"
      - "TODO.md"
      - "research/**"
      - "docs/**"
      - "configs/reproduction/**"
      - "configs/readiness/**"
      - "tools/audit_research_governance.py"
      - "tests/test_research_governance.py"
      - ".github/workflows/research-governance.yml"
  pull_request:
    paths:
      - "PROJECT_STATE.yaml"
      - "TODO.md"
      - "research/**"
      - "docs/**"
      - "configs/reproduction/**"
      - "configs/readiness/**"
      - "tools/audit_research_governance.py"
      - "tests/test_research_governance.py"
      - ".github/workflows/research-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: python -m pip install --upgrade pip PyYAML pytest
      - name: Audit research governance
        run: python tools/audit_research_governance.py --json
      - name: Test governance contracts
        run: python -m pytest -q tests/test_research_governance.py
