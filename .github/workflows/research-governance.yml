name: Research governance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s4d-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: python -m pip install --upgrade pip PyYAML pytest
      - name: Audit research governance
        run: python tools/audit_research_governance.py --json
      - name: Test governance contracts
        run: python -m pytest -q tests/test_research_governance.py
